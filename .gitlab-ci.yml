stages:
  - test

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip
    - venv/

before_script:
  - apt-get update -qq && apt-get install -y -qq libgl1-mesa-dev libxcb-xinerama0
  - python3 -m venv venv
  - source venv/bin/activate
  - pip install --upgrade pip
  - pip install -r requirements.txt

lint:
  stage: test
  script:
    - pip install flake8 pylint
    - flake8 *.py --max-line-length=120
    - pylint *.py --exit-zero
  allow_failure: true  

test:
  stage: test
  script:
    - pip install pytest pytest-qt pytest-cov
    - xvfb-run --auto-servernum pytest tests/ -v --cov=. --cov-report=term
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - coverage.xml
      - htmlcov/

check_imports:
  stage: test
  script:
    - source venv/bin/activate
    - python -c "Имспорт работает"
    - python -m py_compile front.py back.py
